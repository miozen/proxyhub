name: images

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/vonzhen/proxyhub
          tags: |
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=dev-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=proxyhub-dev
          cache-to: type=gha,mode=max,scope=proxyhub-dev
      - name: Verify ProxyHub manifest platforms
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            image=ghcr.io/vonzhen/proxyhub:dev
          else
            image="ghcr.io/vonzhen/proxyhub:$GITHUB_REF_NAME"
          fi
          manifest="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$manifest"
          printf '%s\n' "$manifest" | grep -q 'linux/amd64'
          printf '%s\n' "$manifest" | grep -q 'linux/arm64'
      - name: Verify pinned Sub-Store manifest platforms
        run: |
          manifest="$(docker buildx imagetools inspect xream/sub-store:2.36.21)"
          printf '%s\n' "$manifest"
          printf '%s\n' "$manifest" | grep -q 'linux/amd64'
          printf '%s\n' "$manifest" | grep -q 'linux/arm64'

  release-assets:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          chmod +x scripts/build-deployment-assets.sh
          scripts/build-deployment-assets.sh "$version" dist
          cd dist
          sha256sum -c SHA256SUMS
          tar -tzf "proxyhub-deploy-$version.tar.gz" | sort >contents.txt
          printf '%s\n' .env.example VERSION compose.yaml proxyhub | sort >expected.txt
          diff -u expected.txt contents.txt
          test "$(tar -xOf "proxyhub-deploy-$version.tar.gz" VERSION)" = "$version"
          sh -n install.sh
          ./install.sh --help
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/proxyhub-deploy-$version.tar.gz" \
            dist/install.sh \
            dist/SHA256SUMS \
            --verify-tag \
            --title "ProxyHub $GITHUB_REF_NAME" \
            --generate-notes





