name: dev-image

on:
  push:
    branches: [dev]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/vonzhen/proxyhub
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=proxyhub-dev
          cache-to: type=gha,mode=max,scope=proxyhub-dev
      - name: Verify ProxyHub manifest platforms
        run: |
          manifest="$(docker buildx imagetools inspect ghcr.io/vonzhen/proxyhub:dev)"
          printf '%s\n' "$manifest"
          printf '%s\n' "$manifest" | grep -q 'linux/amd64'
          printf '%s\n' "$manifest" | grep -q 'linux/arm64'
      - name: Verify pinned Sub-Store manifest platforms
        run: |
          manifest="$(docker buildx imagetools inspect xream/sub-store:2.36.21)"
          printf '%s\n' "$manifest"
          printf '%s\n' "$manifest" | grep -q 'linux/amd64'
          printf '%s\n' "$manifest" | grep -q 'linux/arm64'





