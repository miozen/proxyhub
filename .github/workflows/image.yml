name: images

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            publish=true
            tag=dev
            version=dev
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            publish=true
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            version="$(node -p "require('./package.json').version")"
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              publish=false
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/miozen/proxyhub
          tags: |
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=dev-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ needs.prepare.outputs.tag }},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=proxyhub-dev
          cache-to: type=gha,mode=max,scope=proxyhub-dev
      - name: Verify ProxyHub manifest platforms
        run: |
          image="ghcr.io/miozen/proxyhub:${{ needs.prepare.outputs.tag }}"
          manifest="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$manifest"
          printf '%s\n' "$manifest" | grep -q 'linux/amd64'
          printf '%s\n' "$manifest" | grep -q 'linux/arm64'
      - name: Verify pinned Sub-Store manifest platforms
        run: |
          manifest="$(docker buildx imagetools inspect xream/sub-store:2.36.21)"
          printf '%s\n' "$manifest"
          printf '%s\n' "$manifest" | grep -q 'linux/amd64'
          printf '%s\n' "$manifest" | grep -q 'linux/arm64'

  release-assets:
    needs: [prepare, publish]
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify release assets
        run: |
          version="${{ needs.prepare.outputs.version }}"
          chmod +x scripts/build-deployment-assets.sh
          scripts/build-deployment-assets.sh "$version" dist
          cd dist
          sha256sum -c SHA256SUMS
          tar -tzf "proxyhub-deploy-$version.tar.gz" | sort >contents.txt
          printf '%s\n' .env.example VERSION compatibility.json compose.yaml proxyhub | sort >expected.txt
          diff -u expected.txt contents.txt
          test "$(tar -xOf "proxyhub-deploy-$version.tar.gz" VERSION)" = "$version"
          test "$(tar -xOf "proxyhub-deploy-$version.tar.gz" compatibility.json |
            sed -n 's/.*"proxyhub_version":[[:space:]]*"\([^"]*\)".*/\1/p')" = "$version"
          sh -n install.sh
          ./install.sh --help
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "dist/proxyhub-deploy-$version.tar.gz" \
              dist/install.sh \
              dist/SHA256SUMS \
              --clobber
          else
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              target_args=(--verify-tag)
            else
              target_args=(--target "$GITHUB_SHA")
            fi
            gh release create "$tag" \
              "dist/proxyhub-deploy-$version.tar.gz" \
              dist/install.sh \
              dist/SHA256SUMS \
              "${target_args[@]}" \
              --title "ProxyHub $tag" \
              --generate-notes
          fi





