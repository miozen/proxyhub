name: check

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm audit --audit-level=high
      - name: Validate operations command
        run: sh -n ops/proxyhub

  docker:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      DATA_ENCRYPTION_KEY: ci-encryption-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: proxyhub:ci
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Run pinned Sub-Store integration smoke
        run: |
          cp .env.example .env
          docker compose up -d --build
          node scripts/p5-compose-smoke.js
          substore_id="$(docker compose ps -q sub-store)"
          test "$(docker inspect "$substore_id" --format '{{len .HostConfig.PortBindings}}')" = "0"
      - name: Exercise backup and failed-update rollback
        run: |
          chmod +x ops/proxyhub
          ln -s "$PWD/ops/proxyhub" /tmp/proxyhub
          backup_path="$(/tmp/proxyhub backup ci-smoke)"
          test -s "$backup_path/proxyhub-data.tgz"
          test -s "$backup_path/substore-data.tgz"
          proxyhub_id="$(docker compose ps -q proxyhub)"
          substore_id="$(docker compose ps -q sub-store)"
          /tmp/proxyhub restart proxyhub
          test "$(docker compose ps -q sub-store)" = "$substore_id"
          /tmp/proxyhub restart sub-store
          test "$(docker compose ps -q proxyhub)" = "$proxyhub_id"
          /tmp/proxyhub status proxyhub
          /tmp/proxyhub status sub-store
          if /tmp/proxyhub start unknown; then
            echo "Invalid component unexpectedly succeeded"
            exit 1
          fi
          substore_id="$(docker compose ps -q sub-store)"
          if /tmp/proxyhub update --proxyhub-image invalid.invalid/proxyhub:missing; then
            echo "Injected update failure unexpectedly succeeded"
            exit 1
          fi
          test "$(docker compose ps -q sub-store)" = "$substore_id"
          P5_EXISTING=1 node scripts/p5-compose-smoke.js
          proxyhub_id="$(docker compose ps -q proxyhub)"
          if /tmp/proxyhub update --substore-image invalid.invalid/sub-store:missing --confirm-substore; then
            echo "Injected Sub-Store update failure unexpectedly succeeded"
            exit 1
          fi
          test "$(docker compose ps -q proxyhub)" = "$proxyhub_id"
          P5_EXISTING=1 node scripts/p5-compose-smoke.js
          if /tmp/proxyhub rollback; then
            echo "Component-less rollback unexpectedly succeeded"
            exit 1
          fi
          /tmp/proxyhub uninstall
          docker volume inspect proxyhub-data proxyhub-substore-data
          if PROXYHUB_PURGE_CONFIRM=NO /tmp/proxyhub uninstall --purge; then
            echo "Purge without exact confirmation unexpectedly succeeded"
            exit 1
          fi
          /tmp/proxyhub start
          P5_EXISTING=1 node scripts/p5-compose-smoke.js
      - name: Scan ProxyHub image
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/vonzhen/proxyhub:dev
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Compose
        if: always()
        run: docker compose down --volumes

  platforms:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate host command on Ubuntu
        run: sh -n ops/proxyhub
      - name: Validate runtime on Debian 12
        run: |
          docker run --rm -v "$PWD:/work" -w /work node:22-bookworm \
            sh -c "npm ci && npm run ci && sh -n ops/proxyhub"





