name: check

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: proxyhub:ci
      - name: Validate Compose
        env:
          SESSION_SECRET: ci-session-secret-with-at-least-32-characters
          DATA_ENCRYPTION_KEY: ci-encryption-key-with-at-least-32-characters
        run: docker compose config --quiet




